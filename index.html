<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Flash Your ESP32 Smart Battery Monitor</title>
  <!-- Load the ESP Web Tools button component -->
  <script type="module"
          src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>

  <!-- Simple, responsive styling -->
  <style>
    /* Reset a few defaults */
    *, *::before, *::after {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    /* Center the whole page vertically & horizontally */
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: system-ui, sans-serif;
      background: linear-gradient(135deg, #e3f2fd 0%, #ffffff 100%);
      color: #333;
      text-align: center;
      padding: 1rem;
    }

    h1 {
      margin-bottom: 0.5rem;
      font-size: 2.2rem;
      color: #0d47a1;
    }
    p {
      margin-bottom: 1.5rem;
      font-size: 1.1rem;
      line-height: 1.4;
    }

    /* Give the button a little breathing room */
    esp-web-install-button {
      margin-top: 0.5rem;
    }
  </style>
</head>

<body>
  <h1>Install Firmware on Your ESP32</h1>
  <p>Connect your ESP32 via USB, then click the button below.</p>

  <esp-web-install-button manifest="firmware/manifest.json"></esp-web-install-button>
</body>
</html>
